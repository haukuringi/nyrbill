<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nýrbíll.is – nýir bílar á Íslandi, verðlisti og samanburður</title>
  <meta name="description" content="Verðlisti og samanburður á nýjum bílum í boði hjá íslenskum bílaumboðum." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/stil.css" />
</head>
<body>
  <header class="siduhaus">
    <div class="vefsvaedi">
      <h1><a href="index.html">Nýrbíll.is</a></h1>
      <p>Verðlisti og samanburður á nýjum bílum í boði hjá íslenskum bílaumboðum.</p>
    </div>
  </header>

  <main class="vefsvaedi">
    <div class="sia-pallbord">
      <div class="styringar">
        <input type="text" id="sia-leit" placeholder="Leita eftir merki eða gerð…" />
        <select id="sia-rodun">
          <option value="verd-haekkandi">Verð – lægst fyrst</option>
          <option value="verd-laekkandi">Verð – hæst fyrst</option>
          <option value="draegni">Drægni – mest fyrst</option>
          <option value="nafn">Nafn (A–Ö)</option>
        </select>
      </div>

      <div class="sia-hopur">
        <select id="sia-merki"><option value="">Öll merki</option></select>
        <select id="sia-umbod"><option value="">Öll umboð</option></select>
        <select id="sia-flokkur"><option value="">Allir flokkar</option></select>
        <select id="sia-orkugjafi"><option value="">Allir orkugjafar</option></select>
        <select id="sia-drif"><option value="">Öll drif</option></select>
        <select id="sia-saeti"><option value="">Allur sætafjöldi</option></select>
        <input type="number" id="sia-verd-fra" placeholder="Verð frá (kr.)" min="0" step="100000" />
        <input type="number" id="sia-verd-til" placeholder="Verð til (kr.)" min="0" step="100000" />
        <input type="number" id="sia-draegni" placeholder="Lágm. drægni (km)" min="0" step="10" />
        <button type="button" id="sia-nullstilla" class="smaknappur">Núllstilla síur</button>
      </div>

      <label class="rofi">
        <input type="checkbox" id="sia-styrkur-rofi" />
        Sýna verð eftir rafbílastyrk (breytir röðun og verðbili)
      </label>
    </div>

    <p id="fjoldi-skilabod" class="tal-fjolda"></p>
    <div id="bilagrind" class="bilagrind"></div>
    <p id="tomt-skilabod" class="tomt-skilabod" hidden>Engir bílar fundust sem passa við valdar síur.</p>
  </main>

  <div class="vefsvaedi">
    <footer class="sidufotur">
      <p>Verð eru birt án ábyrgðar og geta hafa breyst. Staðfestið alltaf verð hjá umboði.</p>
      <p id="sidast-uppfaert"></p>
    </footer>
  </div>

  <div id="samanburdarbox" class="samanburdarbox" hidden></div>

  <script src="js/gogn.js"></script>
  <script src="js/snid.js"></script>
  <script src="js/heiti.js"></script>
  <script src="js/karfa.js"></script>
  <script src="js/listi.js"></script>
</body>
</html>
